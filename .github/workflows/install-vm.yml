name: install-vm
on:
  workflow_dispatch:
    inputs:
      categories:
        description: 'Categories CSV (or "all"). Default installs everything; use a CSV for a subset.'
        required: true
        default: 'all'
        type: string
      security_tools:
        description: 'security-tools sub-list (csv|all)'
        required: false
        default: 'all'
        type: string

jobs:
  install-vm:
    name: install-vm
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - name: Run cervelAI setup
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CATS: ${{ inputs.categories }}
          SEC: ${{ inputs.security_tools }}
        run: |
          sudo -E env \
            dev_mode=nomenu \
            CERVELAI_SELECTED="$CATS" \
            CERVELAI_SECURITY_TOOLS="$SEC" \
            CERVELAI_SHELL=bash \
            CERVELAI_MULTIPLEXER=none \
            bash setup.sh 2>&1 | tee /tmp/install.log

      - name: Fail on real ERR (WARN tolerated)
        run: |
          errs=$(grep -cE "^\[ ERR " /tmp/install.log || true)
          warns=$(grep -cE "^\[ WARN " /tmp/install.log || true)
          echo "summary: WARN=$warns ERR=$errs"
          [ "$errs" = "0" ]

      - name: Verify security-tools binaries
        if: contains(inputs.categories, 'security-tools') || inputs.categories == 'all'
        run: |
          sudo -u agent bash -lc '
            eval "$(mise activate bash)"
            missing=0
            for b in sops age kingfisher varlock infisical teller dotenvx gitleaks trivy syft cosign; do
              if $b --version >/dev/null 2>&1; then
                printf "  ok  %s\n" "$b"
              else
                printf "  MISSING %s\n" "$b"
                missing=$((missing+1))
              fi
            done
            [ $missing = 0 ]'

      - name: Tail install log on failure
        if: failure()
        run: tail -200 /tmp/install.log || true
