name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
          tool_versions: |
            aqua:koalaman/shellcheck latest
            aqua:mvdan/sh latest
      - run: bash check.sh

  smoke:
    name: smoke
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - run: bash smoke.sh
