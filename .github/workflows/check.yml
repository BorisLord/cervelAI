name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
          tool_versions: |
            aqua:koalaman/shellcheck latest
            aqua:mvdan/sh latest
      - run: bash check.sh

  smoke-menu:
    name: smoke-menu
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - name: menu source test
        run: |
          set -uo pipefail
          CATEGORIES=(agents token-savers agent-memory usage-trackers ai-tools editor ide-web runtimes workflow-tools containers k8s-stack iac-stack cloud-stack data-stack cli-extras security-tools git-forges blockchain)
          export CATEGORIES
          _src() { source menu.sh; }
          _src
          [[ -n "${_MENU_DEFAULT_OFF[*]:-}" ]] || exit 1
          for cat in "${CATEGORIES[@]}"; do
            [[ -n "${_MENU_DESC[$cat]:-}" ]] || { echo "missing _MENU_DESC[$cat]"; exit 1; }
          done
          declare -F \
            menu_select menu_shell_select menu_multiplexer_select \
            menu_runtimes_select menu_agents_select menu_agent_memory_select \
            menu_ai_tools_select menu_editors_select menu_token_saver_select \
            menu_containers_select menu_k8s_stack_select menu_data_stack_select \
            menu_cloud_stack_select menu_blockchain_select \
            menu_cli_extras_select menu_security_tools_select \
            menu_git_forges_select >/dev/null || exit 1
          echo "OK"

  smoke-dryrun:
    name: smoke-dryrun
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: setup.sh dryrun
        run: sudo dev_mode=dryrun,nomenu CERVELAI_NO_PROMPT=1 CERVELAI_SELECTED=all bash setup.sh
