[misc]
assume_yes = true
# topgrade's self_update uses anonymous GitHub API (no token); mise already upgrades it via aqua.
no_self_update = true
disable = [
    "system",  # agent has no sudo; apt is root's job (unattended-upgrades + manual root apt)
    "pnpm",  # mise:npm backend owns pnpm; `pnpm root -g` is unrelated
    "node",  # mise drives node version
    "pip3",  # mise:pipx backend covers it
    "yarn",  # not used
]

# hermes is installed via curl|bash (not mise/apt) AND has no auto-updater, so topgrade would never
# refresh it — pull its updates here. Guarded so it's a no-op when hermes isn't installed.
# (claude self-updates on its own; codex/opencode/etc. are mise-managed — no entry needed.)
[commands]
"hermes agent" = "if command -v hermes >/dev/null 2>&1; then hermes update --yes; fi"
