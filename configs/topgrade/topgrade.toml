# cervelAI topgrade config.
# Skip step types covered by mise (mise upgrade handles them via its backends),
# and tools that recursively fetch flaky upstream repos.
[misc]
assume_yes = true
# topgrade's self_update calls api.github.com anonymously (no GITHUB_TOKEN support);
# mise already handles topgrade upgrades via aqua:topgrade-rs/topgrade — avoid the duplicate.
no_self_update = true
disable = [
    "pnpm",  # mise:npm backend uses pnpm internally; `pnpm root -g` is unrelated
    "node",  # idem: mise drives node version
    "pip3",  # mise:pipx backend covers it
    "yarn",  # not used
]
