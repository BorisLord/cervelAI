[misc]
assume_yes = true
# topgrade's self_update uses anonymous GitHub API (no token); mise already upgrades it via aqua.
no_self_update = true
disable = [
    "system",  # agent has no sudo; apt is root's job (unattended-upgrades + manual root apt)
    "pnpm",  # mise:npm backend owns pnpm; `pnpm root -g` is unrelated
    "node",  # mise drives node version
    "pip3",  # mise:pipx backend covers it
    "yarn",  # not used
]
