# pnpm v11: allowBuilds moved out of .npmrc. These 3 CLIs download a native binary in postinstall.
allowBuilds:
  - opencode-ai
  - "@anthropic-ai/claude-code"
  - deepseek-tui

# Set here (not NPM_CONFIG_MINIMUM_RELEASE_AGE) to avoid leaking "Unknown env config" into npm.
# install/_finalize.sh comments this out after install to restore the default 1440-min quarantine.
minimumReleaseAge: 0
