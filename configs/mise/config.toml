# mise: cervelAI baseline settings.
# Settings only: the [tools] section is owned by mise. `mise use -g <tool>`
# (run by install/runtimes.sh and the install/*.sh scripts) appends to this
# file; node, python and pnpm always end up here. Per-project .mise.toml
# overrides as usual.

[settings.npm]
# Every `mise use -g npm:<pkg>` routes through pnpm (faster + content-addressable
# store dedupes). pnpm itself bootstraps with MISE_NPM_PACKAGE_MANAGER=npm in
# install/runtimes.sh to break the circular dep.
package_manager = "pnpm"
