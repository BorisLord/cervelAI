# mise — cervelAI baseline.
# Global defaults, overridden by any per-project .mise.toml.
# go/rust are not listed (no terminal AI agent needs them) — add with:
#   mise use -g go@latest rust@latest
# or via CERVELAI_RUNTIMES=node,python,go,rust at setup time.

[tools]
node   = "lts"
python = "latest"

[settings]
experimental = true
